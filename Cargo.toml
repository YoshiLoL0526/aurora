[package]
name = "aurora_core"
version = "0.1.0"
edition = "2024"
description = "Núcleo nativo de Aurora: layout, render, eventos y animaciones."
license = "MIT"
publish = false

[dependencies]
arboard = { version = "3", default-features = false }
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py310"] }
skia-safe = { version = "0.153.3", features = ["textlayout"] }
softbuffer = "0.4.8"
taffy = "0.15.0"
unicode-segmentation = { version = "1.13.3", default-features = false }
winit = "0.30.13"

[lib]
name = "_core"
crate-type = ["cdylib"]

[profile.release]
lto = "thin"
codegen-units = 4
