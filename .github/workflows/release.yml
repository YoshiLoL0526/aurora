# Publica wheels en PyPI al crear un tag vX.Y.Z y crea su release en GitHub con las notas del
# CHANGELOG y los mismos archivos.
#
# Requisitos (una sola vez):
#   1. Crear el proyecto en PyPI y configurar "Trusted Publishing" para este repositorio
#      y el workflow release.yml (sin tokens ni secretos).
#   2. Crear el environment "pypi" en la configuración del repositorio.
#
# Nota: el wheel es abi3, así que basta uno por plataforma y arquitectura para todas
# las versiones de Python >= 3.11.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheel ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64 }
          - { name: windows-x64, runner: windows-latest, target: x64 }
          - { name: macos-arm64, runner: macos-latest, target: aarch64 }
          # macos-13 ya no existe en GitHub Actions; macos-15-intel es la última imagen Intel.
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64 }
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: 2_28
          before-script-linux: dnf install -y fontconfig-devel freetype-devel
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.platform.name }}
          path: dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  publish:
    name: Publicar en PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Release en GitHub
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Crear la release con la sección del CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            /^## \[/ { p = index($0, "## [" v "]") == 1; next }
            /^\[Sin publicar\]:/ { exit }
            p
          ' CHANGELOG.md > notas.md
          if [ ! -s notas.md ]; then
            echo "::error::CHANGELOG.md no tiene sección para $version"
            exit 1
          fi
          gh release create "$TAG" dist/* --title "Aurora $version" --notes-file notas.md --verify-tag
