name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (Python + Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Dependencias del sistema
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype-dev
      - name: Ruff
        run: |
          uvx ruff check .
          uvx ruff format --check .
      - name: rustfmt
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release -- -D warnings

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencias del sistema
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype-dev
      - name: Compilar e instalar
        run: uv sync
      # Los runners compartidos tienen ruido: no se falla por tiempos, se publican para comparar.
      # Para comparar dos ejecuciones, descarga los JSON y usa `--compare`.
      - name: Ejecutar la suite
        run: uv run benchmarks/run.py --json bench.json --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Subir resultados
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ github.sha }}
          path: bench.json

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype-dev
      - name: Compilar e instalar
        run: uv sync
      - name: Tests
        run: uv run pytest -v
      # Con `extension-module` el binario de tests de Rust no enlaza contra libpython en
      # Linux/macOS; en Windows sí (python3.lib), así que los tests unitarios corren ahí.
      - name: Tests de Rust (Windows)
        if: runner.os == 'Windows'
        run: uv run cargo test --release
      - name: Renderizar los ejemplos (smoke test visual)
        run: |
          uv run examples/hello.py --png hello.png
          uv run examples/studio.py --png studio-shots
      - name: Subir capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            hello.png
            studio-shots/
          if-no-files-found: ignore
