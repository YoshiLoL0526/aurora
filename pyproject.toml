[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "aurora-ui"
version = "0.3.0"
description = "Interfaces de escritorio profesionales en Python, con un núcleo nativo en Rust (Skia + Taffy)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Raidel" }]
keywords = ["gui", "ui", "desktop", "declarative", "reactive", "skia", "rust", "dashboard"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/YoshiLoL0526/aurora"
Documentation = "https://yoshilol0526.github.io/aurora/"
Issues = "https://github.com/YoshiLoL0526/aurora/issues"
Changelog = "https://github.com/YoshiLoL0526/aurora/blob/main/CHANGELOG.md"

[project.scripts]
aurora = "aurora.cli:main"

[project.optional-dependencies]
build = [
    "pyinstaller>=6.10",
]

[tool.maturin]
python-source = "python"
module-name = "aurora._core"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
    "maturin>=1.7,<2",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7",
    "numpy>=1.26",
    "polars>=1.0",
    "pyinstaller>=6.10",
    "pytest>=8",
    "ruff>=0.6",
    "ty>=0.0.88",
]

[tool.uv]
# uv cachea el paquete construido: estas claves hacen que recompile
# automáticamente el núcleo Rust cuando cambie el código nativo.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["python/aurora/_core.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E731", "RUF001", "RUF002", "RUF003"]  # lambdas como callbacks; tipografía en español

[tool.ruff.lint.isort]
known-first-party = ["aurora"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["B023", "E501"]

[tool.ty.environment]
python-version = "3.11"
# `python/` permite comprobar sin instalar el paquete (el núcleo se resuelve con `_core.pyi`);
# `benchmarks/` y `docs/hooks/`, porque tests/test_benchmarks.py y tests/test_docs.py los importan
# añadiéndolos a sys.path.
extra-paths = ["python", "benchmarks", "docs/hooks"]

# `Pilot.rect()` y compañía devuelven `None` si la clave no existe; en los tests se indexa
# directamente: si faltara la clave, el test fallaría igual (TypeError) y con un mensaje claro.
[[tool.ty.overrides]]
include = ["tests/**"]
rules = { not-subscriptable = "ignore", not-iterable = "ignore" }
